<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 3 - Kennedy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050308; font-family: 'Geist', sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    /* Botón Volver súper animado y top-right */
    .back-btn {
      position: absolute; top: 24px; right: 24px; z-index: 1000;
      background: rgba(12, 10, 20, 0.6); backdrop-filter: blur(10px);
      border: 1px solid rgba(79, 220, 204, 0.3);
      color: #4fdccc; padding: 12px 24px; border-radius: 999px;
      font-size: 13px; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 10px; cursor: pointer; overflow: hidden;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 20px rgba(79, 220, 204, 0.1);
    }
    .back-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(79, 220, 204, 0.2), transparent); transition: all 0.5s ease; }
    .back-btn:hover { background: rgba(79, 220, 204, 0.1); border-color: rgba(79, 220, 204, 0.6); transform: scale(1.05); box-shadow: 0 0 30px rgba(79, 220, 204, 0.3); color: #fff; }
    .back-btn:hover::before { left: 100%; }
    .back-btn span { display: inline-block; animation: floatText 3s ease-in-out infinite; }
    .back-btn span:nth-child(1) { animation-delay: 0.0s; } .back-btn span:nth-child(2) { animation-delay: 0.1s; }
    .back-btn span:nth-child(3) { animation-delay: 0.2s; } .back-btn span:nth-child(4) { animation-delay: 0.3s; }
    .back-btn span:nth-child(5) { animation-delay: 0.4s; } .back-btn span:nth-child(6) { animation-delay: 0.5s; }
    @keyframes floatText { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); color: #fff; } }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
    <div><span>V</span><span>o</span><span>l</span><span>v</span><span>e</span><span>r</span></div>
  </a>
  <iframe src="https://anasoficasca-code.github.io/modelamiento2/modulo-12-problemas.html?embed=1" onload="hideUI(this)"></iframe>
  <script>
    function hideUI(iframe) {
      try {
        const doc = iframe.contentWindow.document;
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = `
          .sidebar, .site-nav, .navigation-unified, aside, .nav, header { display: none !important; }
          .app, .main, body, .viewport, .map-container, #map { padding-left: 0 !important; margin-left: 0 !important; left: 0 !important; width: 100% !important; max-width: 100% !important; }
          .overlay-tools { left: 20px !important; top: 80px !important; }
        `;
        doc.head.appendChild(style);
      } catch(e) {}
    }
  </script>
</body>
</html>
