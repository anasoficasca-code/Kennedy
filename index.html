<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 Puntos - Kennedy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #050308;
      font-family: 'Geist', sans-serif;
      color: #fff;
      overflow-x: hidden;
      scroll-snap-type: y mandatory; /* Scroll snap for 4 distinct pages */
    }
    
    .panel {
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      flex-direction: column;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    /* Título simple en cada panel */
    .panel-title {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(12, 10, 20, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
      font-size: 14px;
      pointer-events: none; /* Let clicks pass through to iframe */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #050308;
    }

    /* Estilos del panel 4 (Red Causal) */
    #panel4 { background: #0c0a14; overflow: hidden; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    
    .toolbar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      gap: 12px;
      background: rgba(12, 10, 20, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f4f2ff;
      font-family: 'Geist', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }
    .btn.active-hubs { background: rgba(128, 82, 255, 0.2); border-color: #8052ff; color: #fff; }
    .btn.active-bridges { background: rgba(255, 184, 41, 0.2); border-color: #ffb829; color: #fff; }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(12, 10, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 280px;
      font-size: 13px;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 20;
    }
    .tooltip.visible { opacity: 1; }
    .tooltip-title { font-weight: 600; margin-bottom: 6px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .tooltip-dot { width: 10px; height: 10px; border-radius: 50%; }
    .tooltip-desc { color: #9a93ad; }
  </style>
</head>
<body>

  <!-- 1. Simulación 3D de tránsito -->
  <section class="panel">
    <div class="panel-title">1. Simulación 3D de tránsito</div>
    <iframe src="https://anasoficasca-code.github.io/modelamiento2/modulo-08-3d.html?embed=1" onload="hideUI(this)"></iframe>
  </section>

  <!-- 2. Navegador multiescalar -->
  <section class="panel">
    <div class="panel-title">2. Navegador multiescalar (Capas)</div>
    <iframe src="https://anasoficasca-code.github.io/modelamiento2/modulo-05.html?embed=1" onload="hideUI(this)"></iframe>
  </section>

  <!-- 3. Problemáticas de Kennedy -->
  <section class="panel">
    <div class="panel-title">3. Problemáticas de Kennedy</div>
    <iframe src="https://anasoficasca-code.github.io/modelamiento2/modulo-12-problemas.html?embed=1" onload="hideUI(this)"></iframe>
  </section>

  <!-- 4. Red Causal Interactiva -->
  <section class="panel" id="panel4">
    <div class="toolbar">
      <button class="btn" id="btnHubs">Destacar Hubs</button>
      <button class="btn" id="btnBridges">Ver Nodos Puente</button>
    </div>
    <canvas id="networkCanvas"></canvas>
    <div class="tooltip" id="tooltip">
      <div class="tooltip-title"><div class="tooltip-dot" id="tt-dot"></div> <span id="tt-title"></span></div>
      <div class="tooltip-desc" id="tt-desc"></div>
    </div>
  </section>

  <script>
    // --- Ocultar UI de Iframes (Iconos de la izquierda) ---
    function hideUI(iframe) {
      try {
        const doc = iframe.contentWindow.document;
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = `
          .sidebar, .site-nav, .navigation-unified, aside, .nav, header { display: none !important; }
          .app, .main, body, .viewport, .map-container, #map { padding-left: 0 !important; margin-left: 0 !important; left: 0 !important; width: 100% !important; max-width: 100% !important; }
          .overlay-tools { left: 20px !important; }
        `;
        doc.head.appendChild(style);
      } catch(e) {}
    }

    // --- Lógica del Panel 4 (Red Causal) ---
    const NODES_DATA = [
      { id: "n1", corto: "Colapso vial", full: "Colapso de la red vial local y de los corredores arteriales", color: "#5b8ad6" },
      { id: "n2", corto: "Contaminación hídrica", full: "Contaminación y alteración biofísica de la red hídrica", color: "#d669a8" },
      { id: "n3", corto: "Concentración mercado", full: "Concentración metropolitana del mercado mayorista", color: "#e2635a" },
      { id: "n4", corto: "Sobrecarga residencial", full: "Sobrecarga infraestructural de la densificación en altura", color: "#9b7ede" },
      { id: "n5", corto: "Interferencia espacio público", full: "Interferencia de actividades logísticas en espacio público", color: "#4caf7d" },
      { id: "n6", corto: "Acumulación residuos", full: "Acumulación de residuos y transporte sobre red ecológica", color: "#e8a33d" },
      { id: "n7", corto: "Inoperancia oficial", full: "Inoperancia del ordenamiento oficial ante patrones reales", color: "#45b8c4" }
    ];

    const LINKS_DATA = [
      { from: "n7", to: "n3", verbo: "Norma permite hiperconcentración regional." },
      { from: "n7", to: "n4", verbo: "Aprueba licencias sin exigir expansión de redes." },
      { from: "n3", to: "n5", verbo: "Toneladas y vehículos desbordan espacio público." },
      { from: "n3", to: "n6", verbo: "Desechos presionan los bordes de la franja ambiental." },
      { from: "n5", to: "n1", verbo: "Camiones bloquean tráfico local y arterial." },
      { from: "n4", to: "n2", verbo: "Aumento poblacional sobrepasa capacidad hídrica." },
      { from: "n4", to: "n1", verbo: "Viajes cotidianos aceleran colapso vial." },
      { from: "n6", to: "n2", verbo: "Basura y lixiviados contaminan humedal." },
      { from: "n1", to: "n3", loopLabel: "B1", verbo: "Bloqueos frenan entrada de camiones (Autorregulación)." },
      { from: "n5", to: "n7", loopLabel: "R1", verbo: "Prácticas informales hacen obsoleta la norma." },
      { from: "n2", to: "n4", loopLabel: "B2", verbo: "Deterioro actúa como límite biótico." }
    ];

    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttDesc = document.getElementById('tt-desc');
    const ttDot = document.getElementById('tt-dot');
    
    let highlightHubs = false;
    let highlightBridges = false;
    let hoveredNode = null, hoveredLink = null;
    let mouseX = -1000, mouseY = -1000;
    let isDragging = false, dragNode = null;
    let cx, cy, width, height;

    const nodes = NODES_DATA.map(n => ({ ...n, x: Math.random()*800, y: Math.random()*600, vx: 0, vy: 0, degree: 0, isBridge: false }));
    const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
    
    const links = LINKS_DATA.map(l => {
      nodeMap[l.from].degree++; nodeMap[l.to].degree++;
      return { ...l, source: nodeMap[l.from], target: nodeMap[l.to] };
    });

    // Hardcode known bridges for the 7 node graph for visual clarity based on topology
    nodeMap['n3'].isBridge = true; // Concentración
    nodeMap['n4'].isBridge = true; // Sobrecarga
    nodeMap['n7'].isBridge = true; // Inoperancia

    function resize() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight;
      canvas.width = width; canvas.height = height;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    function applyForces() {
      // Repulsión
      for(let i=0; i<nodes.length; i++) {
        for(let j=i+1; j<nodes.length; j++) {
          let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
          let distSq = dx*dx + dy*dy || 0.01;
          let f = 3000 / distSq;
          let dist = Math.sqrt(distSq);
          nodes[i].vx += (dx/dist)*f; nodes[i].vy += (dy/dist)*f;
          nodes[j].vx -= (dx/dist)*f; nodes[j].vy -= (dy/dist)*f;
        }
      }
      // Atracción
      links.forEach(l => {
        let dx = l.target.x - l.source.x, dy = l.target.y - l.source.y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let f = (dist - 160) * 0.05;
        l.source.vx += (dx/dist)*f; l.source.vy += (dy/dist)*f;
        l.target.vx -= (dx/dist)*f; l.target.vy -= (dy/dist)*f;
      });
      // Gravedad
      nodes.forEach(n => {
        n.vx += (cx - n.x) * 0.005; n.vy += (cy - n.y) * 0.005;
        if(n === dragNode) { n.x = mouseX; n.y = mouseY; n.vx = 0; n.vy = 0; }
        else { n.vx *= 0.85; n.vy *= 0.85; n.x += n.vx; n.y += n.vy; }
      });
    }

    function getRadius(n) { return 15 + (highlightHubs ? n.degree * 4 : 0) + (hoveredNode===n ? 4 : 0); }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      applyForces();

      links.forEach(l => {
        const isH = hoveredLink === l || hoveredNode === l.source || hoveredNode === l.target;
        const isD = (hoveredNode || hoveredLink) && !isH;
        
        ctx.beginPath();
        ctx.moveTo(l.source.x, l.source.y);
        const isBi = links.some(ol => ol.source === l.target && ol.target === l.source);
        let mx = (l.source.x + l.target.x)/2, my = (l.source.y + l.target.y)/2;
        if(isBi) {
          let dx = l.target.x - l.source.x, dy = l.target.y - l.source.y;
          let len = Math.hypot(dx,dy);
          mx += (-dy/len)*30; my += (dx/len)*30;
          ctx.quadraticCurveTo(mx, my, l.target.x, l.target.y);
        } else {
          ctx.lineTo(l.target.x, l.target.y);
        }
        ctx.lineWidth = isH ? 2.5 : 1.5;
        ctx.strokeStyle = isD ? 'rgba(255,255,255,0.05)' : (isH ? '#fff' : 'rgba(255,255,255,0.2)');
        if(l.loopLabel) {
          ctx.setLineDash([5,5]);
          ctx.strokeStyle = isD ? 'rgba(255,184,41,0.1)' : (isH ? '#ffb829' : 'rgba(255,184,41,0.5)');
        }
        ctx.stroke(); ctx.setLineDash([]);
        
        if(!isD) {
          let ang = Math.atan2(l.target.y - my, l.target.x - mx);
          let tr = getRadius(l.target);
          ctx.save();
          ctx.translate(l.target.x - Math.cos(ang)*(tr+6), l.target.y - Math.sin(ang)*(tr+6));
          ctx.rotate(ang);
          ctx.fillStyle = ctx.strokeStyle;
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-8,-4); ctx.lineTo(-8,4); ctx.fill();
          ctx.restore();
        }
      });

      [...nodes].sort((a,b)=>a===hoveredNode?1:-1).forEach(n => {
        const isH = hoveredNode===n || (hoveredLink && (hoveredLink.source===n || hoveredLink.target===n));
        const isD = (hoveredNode || hoveredLink) && !isH;
        let r = getRadius(n);

        if(highlightBridges && n.isBridge && !isD) {
          ctx.shadowColor = '#ffb829'; ctx.shadowBlur = 20;
          ctx.beginPath(); ctx.arc(n.x, n.y, r+8, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255,184,41,0.15)'; ctx.fill();
          ctx.strokeStyle = 'rgba(255,184,41,0.8)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
          ctx.stroke(); ctx.setLineDash([]);
        }

        ctx.shadowColor = n.color; ctx.shadowBlur = (isH || (highlightHubs && n.degree>=4)) ? 15 : 0;
        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2);
        ctx.fillStyle = isD ? '#111' : n.color; ctx.fill();
        ctx.lineWidth = isH ? 3 : 1; ctx.strokeStyle = isD ? '#333' : '#fff'; ctx.stroke();
        
        ctx.fillStyle = isD ? '#555' : '#fff'; ctx.font = (isH?'600 ':'500 ')+'12px Geist,sans-serif';
        ctx.textAlign = 'center';
        
        const w = n.corto.split(' ');
        ctx.fillText(w.slice(0, Math.ceil(w.length/2)).join(' '), n.x, n.y+r+16);
        let l2 = w.slice(Math.ceil(w.length/2)).join(' ');
        if(l2) ctx.fillText(l2, n.x, n.y+r+30);
        ctx.restore();
      });
      requestAnimationFrame(draw);
    }

    canvas.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
      if(isDragging) return;
      let fn = null, fl = null;
      for(let i=nodes.length-1; i>=0; i--) {
        let dx = mouseX - nodes[i].x, dy = mouseY - nodes[i].y, r = getRadius(nodes[i]);
        if(dx*dx + dy*dy < (r+5)*(r+5)) { fn = nodes[i]; break; }
      }
      if(!fn) {
        for(let l of links) {
          let A=mouseX-l.source.x, B=mouseY-l.source.y, C=l.target.x-l.source.x, D=l.target.y-l.source.y;
          let dot=A*C+B*D, lenSq=C*C+D*D, p=-1;
          if(lenSq!==0) p = dot/lenSq;
          let xx = p<0 ? l.source.x : p>1 ? l.target.x : l.source.x + p*C;
          let yy = p<0 ? l.source.y : p>1 ? l.target.y : l.source.y + p*D;
          if(Math.hypot(mouseX-xx, mouseY-yy) < 8) { fl = l; break; }
        }
      }
      if(fn!==hoveredNode || fl!==hoveredLink) {
        hoveredNode = fn; hoveredLink = fl;
        canvas.style.cursor = fn||fl ? 'pointer' : 'default';
        if(fn) {
          ttTitle.textContent = fn.corto; ttDesc.textContent = fn.full; ttDot.style.background = fn.color;
          tooltip.classList.add('visible');
        } else if(fl) {
          ttTitle.textContent = fl.loopLabel ? 'Bucle' : 'Relación'; ttDesc.textContent = fl.verbo; ttDot.style.background = fl.loopLabel?'#ffb829':'#fff';
          tooltip.classList.add('visible');
        } else tooltip.classList.remove('visible');
      }
      if(fn||fl) { tooltip.style.left=(mouseX+15)+'px'; tooltip.style.top=(mouseY+15)+'px'; }
    });

    canvas.addEventListener('pointerdown', e => { if(hoveredNode) { isDragging=true; dragNode=hoveredNode; canvas.setPointerCapture(e.pointerId); } });
    canvas.addEventListener('pointerup', e => { isDragging=false; dragNode=null; try{canvas.releasePointerCapture(e.pointerId)}catch(e){} });
    canvas.addEventListener('pointerleave', () => { hoveredNode=null; hoveredLink=null; tooltip.classList.remove('visible'); });

    document.getElementById('btnHubs').onclick = function() { highlightHubs = !highlightHubs; this.classList.toggle('active-hubs', highlightHubs); if(highlightBridges) document.getElementById('btnBridges').click(); };
    document.getElementById('btnBridges').onclick = function() { highlightBridges = !highlightBridges; this.classList.toggle('active-bridges', highlightBridges); if(highlightHubs) document.getElementById('btnHubs').click(); };

    requestAnimationFrame(draw);
  </script>
</body>
</html>
