<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 2 - Corte Axonométrico Interactivo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      overflow: hidden; background: #050308; 
      font-family: 'Geist', sans-serif; color: #f4f2ff;
    }
    
    /* Contenedor del Iframe (Axonometría) */
    .iframe-wrapper {
      position: absolute; inset: 0; 
      transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 10;
    }
    
    body.is-active .iframe-wrapper {
      inset: auto;
      top: 30px; right: 30px;
      width: 48vw; height: 50vh;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
    }
    iframe { width: 100%; height: 100%; border: none; display: block; background: transparent; }

    /* Controles Top Right */
    .top-right-controls {
      position: absolute; top: 30px; right: 30px; z-index: 9999;
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
      pointer-events: none; transition: opacity 0.5s ease;
    }
    .top-right-controls > * { pointer-events: auto; }
    body.is-active .top-right-controls { opacity: 0; pointer-events: none; } /* Ocultar al activar */

    /* Volver button */
    .back-btn {
      background: rgba(12, 10, 20, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 184, 41, 0.5);
      color: #ffb829; padding: 12px 24px; border-radius: 999px;
      font-size: 13px; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 10px; cursor: pointer; overflow: hidden;
    }
    .back-btn:hover { background: rgba(255, 184, 41, 0.2); border-color: rgba(255, 184, 41, 0.8); transform: scale(1.05); color: #fff; }

    /* Dashboard Panels */
    .corte-panel {
      position: absolute; bottom: 30px; right: 30px; 
      width: 48vw; height: calc(50vh - 70px);
      background: rgba(15, 12, 20, 0.9); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
      display: flex; flex-direction: column; padding: 20px;
      opacity: 0; transform: translateY(20px); transition: all 1s ease 0.3s;
      z-index: 5;
    }
    body.is-active .corte-panel { opacity: 1; transform: translateY(0); }
    
    .corte-header { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: #9a93ad; margin-bottom: 15px; display: flex; justify-content: space-between; }
    .corte-content {
      flex: 1; border-radius: 8px; background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
      border: 1px dashed rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 15px; position: relative; overflow: hidden;
    }
    /* Dibujo esquemático del corte transversal simulado */
    .corte-svg-placeholder { width: 100%; height: 100%; position: absolute; inset: 0; opacity: 0.5; }
    .corte-svg-placeholder line { stroke: rgba(255,255,255,0.2); stroke-width: 1; }
    .corte-svg-placeholder path { stroke: #24c8bd; stroke-width: 2; fill: rgba(36, 200, 189, 0.1); }
    .corte-title-overlay { z-index: 2; color: #fff; font-size: 16px; font-weight: 500; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

    /* Panel de Convenciones (Izquierda) */
    .sidebar-panel {
      position: absolute; left: 30px; top: 30px; bottom: 30px; width: 35vw;
      background: rgba(12, 10, 18, 0.85); backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
      padding: 40px; display: flex; flex-direction: column;
      opacity: 0; transform: translateX(-30px); transition: all 1s ease 0.1s;
      z-index: 5; box-shadow: 20px 0 50px rgba(0,0,0,0.3);
    }
    body.is-active .sidebar-panel { opacity: 1; transform: translateX(0); }

    .tag-temporada {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(36, 200, 189, 0.15); color: #24c8bd;
      padding: 6px 12px; border-radius: 999px; font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 20px; align-self: flex-start; border: 1px solid rgba(36, 200, 189, 0.3);
    }
    .humedal-title {
      font-size: 42px; font-weight: 700; line-height: 1.1; margin: 0 0 10px 0;
      background: linear-gradient(135deg, #fff, #9a93ad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stage-subtitle {
      font-size: 18px; color: #ffb829; font-weight: 500; margin-bottom: 30px;
    }
    
    .desc-box {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
      padding: 20px; border-radius: 12px; margin-bottom: 30px;
      font-size: 14px; line-height: 1.6; color: #c4c1cc;
    }

    .agents-list {
      display: flex; flex-direction: column; gap: 12px;
    }
    .agent-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(0,0,0,0.3); border-radius: 8px;
      border-left: 3px solid #444;
    }
    .agent-name { font-size: 13px; font-weight: 500; color: #fff; }
    .agent-val { font-size: 12px; color: #9a93ad; font-variant-numeric: tabular-nums; }

    /* Progreso global */
    .progress-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: #24c8bd; width: 0%; transition: width 0.3s ease; border-radius: 0 0 16px 16px; }

    .hint-click {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      pointer-events: none; animation: pulse 2s infinite; z-index: 100;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    body.is-active .hint-click { display: none; }

    /* CSS inyectado al iframe */
    .iframe-hacks { display: none; }
  </style>
</head>
<body>
  
  <div class="top-right-controls">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
      <div><span>V</span><span>o</span><span>l</span><span>v</span><span>e</span><span>r</span></div>
    </a>
  </div>

  <div class="hint-click">Haz clic en el modelo para iniciar secuencia</div>

  <!-- Panel Izquierdo: Convenciones -->
  <div class="sidebar-panel">
    <div class="tag-temporada"><i class="fa-solid fa-cloud-rain"></i> Sep-Oct, Temporada de Lluvias</div>
    <h1 class="humedal-title">Humedal del Burro</h1>
    <div class="stage-subtitle" id="ui-subtitle">Dimensión Natural</div>
    
    <div class="desc-box" id="ui-desc">
      Iniciando el análisis de las dinámicas hídricas y ecosistémicas del territorio.
    </div>

    <div class="agents-list" id="ui-agents">
      <!-- Se llena dinámicamente -->
    </div>
    
    <div class="progress-bar" id="ui-progress"></div>
    
    <a href="index.html" class="back-btn" style="margin-top: auto; align-self: flex-start; background: rgba(0,0,0,0.5);">
      <i class="fa-solid fa-arrow-left"></i> Volver al Menú
    </a>
  </div>

  <!-- Panel Derecho Inferior: Corte -->
  <div class="corte-panel">
    <div class="corte-header">
      <span>Corte Transversal</span>
      <span style="color:#24c8bd;"><i class="fa-solid fa-ruler"></i> Av. Ciudad de Cali</span>
    </div>
    <div class="corte-content">
      <svg class="corte-svg-placeholder" viewBox="0 0 1000 300" preserveAspectRatio="none">
        <!-- Rejilla base -->
        <line x1="0" y1="100" x2="1000" y2="100" />
        <line x1="0" y1="200" x2="1000" y2="200" />
        <line x1="500" y1="0" x2="500" y2="300" stroke-dasharray="5,5" />
        <!-- Perfil del terreno (simulado) -->
        <path d="M0,150 Q250,140 350,180 T650,220 T850,150 L1000,160 L1000,300 L0,300 Z" />
      </svg>
      <div class="corte-title-overlay" id="corte-title">
        Perfil Topográfico Base
      </div>
    </div>
  </div>

  <!-- Iframe con el corte axonométrico -->
  <div class="iframe-wrapper">
    <iframe id="axoFrame" src="corte.html?embed=1" onload="injectHacks(this)"></iframe>
  </div>

  <script>
    const dataSequence = [
      // 0: Natural Base (se activa al primer clic en la pantalla)
      { sub: "Dimensión Natural: Base", desc: "El terreno en su estado arquitectónico inicial.", color: "#24c8bd", prog: 5, agents: [{n:"Elevación media", v:"2540 msnm"}] },
      // 1: Nat 1
      { sub: "Dimensión Natural: Agua", desc: "Zonas de inundación y cuerpos de agua del humedal.", color: "#3b82f6", prog: 15, agents: [{n:"Cota de inundación anual", v:"2542.5m"}, {n:"Volumen estimado", v:"420,000 m³"}] },
      // 2: Nat 2
      { sub: "Dimensión Natural: Avifauna", desc: "Rutas migratorias y nidificación de especies.", color: "#10b981", prog: 20, agents: [{n:"Especies identificadas", v:"34"}, {n:"Mirlas avistadas", v:"240 indv"}] },
      // 3: Nat 3
      { sub: "Dimensión Natural: Flora", desc: "Cobertura vegetal nativa y árboles de gran porte.", color: "#84cc16", prog: 25, agents: [{n:"Densidad arbórea", v:"42 arb/ha"}] },
      // 4: Nat 4
      { sub: "Dimensión Natural: Suelos", desc: "Capacidad de absorción y permeabilidad.", color: "#a3e635", prog: 30, agents: [{n:"Permeabilidad", v:"Baja (Saturado)"}] },
      
      // 5: Cultural Base
      { sub: "Dimensión Cultural", desc: "Interacción humana, asentamientos y dinámicas sociales.", color: "#f59e0b", prog: 40, agents: [{n:"Población flotante", v:"12,500 hab/día"}] },
      // 6: Cult 1
      { sub: "Dimensión Cultural: Vías", desc: "Red vial principal y accesos peatonales.", color: "#f97316", prog: 50, agents: [{n:"Flujo vehicular", v:"Alto"}, {n:"Nodos de conflicto", v:"3 críticos"}] },
      // 7: Cult 2
      { sub: "Dimensión Cultural: Usos", desc: "Distribución de usos del suelo (residencial, comercial).", color: "#ef4444", prog: 60, agents: [{n:"Uso predominante", v:"Residencial 60%"}] },
      // 8: Cult 3
      { sub: "Dimensión Cultural: Percepción", desc: "Zonas de seguridad, confort y apropiación comunitaria.", color: "#eab308", prog: 70, agents: [{n:"Nivel de apropiación", v:"Medio-Alto"}] },
      
      // 9: Tech Base
      { sub: "Dimensión Tecnológica", desc: "Redes, infraestructura de servicios y telecomunicaciones.", color: "#8b5cf6", prog: 80, agents: [{n:"Cobertura de red", v:"95%"}] },
      // 10: Tech 1
      { sub: "Dimensión Tecnológica: Red Eléctrica", desc: "Tendido eléctrico y subestaciones.", color: "#a855f7", prog: 85, agents: [{n:"Carga máxima", v:"15 MVA"}] },
      // 11: Tech 2
      { sub: "Dimensión Tecnológica: Acueducto", desc: "Red de alcantarillado y drenaje pluvial.", color: "#c084fc", prog: 90, agents: [{n:"Riesgo de rebose", v:"Alto en invierno"}] },
      // 12: Tech 3
      { sub: "Dimensión Tecnológica: Datos", desc: "Zonas wifi y sensores ambientales distribuidos.", color: "#d8b4fe", prog: 95, agents: [{n:"Sensores activos", v:"12 nodos"}] },
      // 13: Tech 4
      { sub: "Dimensión Tecnológica: Integración", desc: "Conexión de la red urbana con el ecosistema.", color: "#f0abfc", prog: 100, agents: [{n:"Eficiencia global", v:"78%"}] }
    ];

    let masterStep = -1;

    // Esta función la llama el iframe cuando hacemos clic en su ventana
    window.advanceMasterSequence = function() {
      masterStep++;
      if (masterStep >= dataSequence.length) {
        masterStep = 1; // Reiniciar o mantener? Lo dejamos circular desde agua
      }

      const win = document.getElementById("axoFrame").contentWindow;
      if (!win) return;

      if (masterStep === 0) {
        // PRIMER CLIC: Activar layout y disparar la secuencia base en el iframe
        document.body.classList.add('is-active');
        if(win.takeSnapshotsAndStart) win.takeSnapshotsAndStart();
      } 
      else if (masterStep >= 1 && masterStep <= 4) {
        if(win.triggerNextNatural) win.triggerNextNatural();
      }
      else if (masterStep === 5) {
        if(win.closeNaturalExplode) win.closeNaturalExplode();
        if(win.openCulturalExplode) win.openCulturalExplode();
      }
      else if (masterStep >= 6 && masterStep <= 8) {
        if(win.triggerNextCultural) win.triggerNextCultural();
      }
      else if (masterStep === 9) {
        if(win.closeCulturalExplode) win.closeCulturalExplode();
        if(win.openTechExplode) win.openTechExplode();
      }
      else if (masterStep >= 10 && masterStep <= 13) {
        if(win.triggerNextTech) win.triggerNextTech();
      }

      // Actualizar la Interfaz con los datos bonitos
      const d = dataSequence[masterStep];
      document.getElementById('ui-subtitle').innerText = d.sub;
      document.getElementById('ui-subtitle').style.color = d.color;
      document.getElementById('ui-desc').innerText = d.desc;
      
      const agentsHtml = d.agents.map(a => `
        <div class="agent-item" style="border-left-color: ${d.color}">
          <span class="agent-name">${a.n}</span>
          <span class="agent-val">${a.v}</span>
        </div>
      `).join('');
      document.getElementById('ui-agents').innerHTML = agentsHtml;
      
      document.getElementById('ui-progress').style.width = d.prog + '%';
      document.getElementById('ui-progress').style.background = d.color;

      document.getElementById('corte-title').innerText = d.sub;
    };

    // Agregar evento global en el documento padre para que cualquier clic avance la secuencia
    document.body.addEventListener('click', () => {
      window.advanceMasterSequence();
    });

    function injectHacks(iframe) {
      try {
        const doc = iframe.contentWindow.document;
        if (!doc) return;
        
        const style = doc.createElement('style');
        style.textContent = `
          aside.sidebar-icons-only, .site-nav, .navigation-unified, header.nav, .nav { display: none !important; }
          .mapboxgl-control-container, .mapbox-logo, .mapboxgl-ctrl-bottom-right, .mapboxgl-ctrl { display: none !important; opacity: 0 !important; pointer-events: none !important; }
          .app, .main, body, .viewport, .map-container, #map { padding-left: 0 !important; margin-left: 0 !important; left: 0 !important; width: 100% !important; max-width: 100% !important; }
          
          /* OCULTAMOS LOS PANELES FEOS DEL IFRAME PORQUE YA LOS TENEMOS LINDOS EN EL DASHBOARD */
          #natClimatePanel, .cult-control-panel, .tech-control-panel, #explodeHint { display: none !important; opacity: 0 !important; pointer-events: none !important; }
          .controls-bar { display: none !important; }

          /* MODIFICAR EL ESCALADO DE LA EXPLOSION PARA QUE QUEPA EN EL MODO CHIQUITO */
          #naturalExplodeOverlay, #culturalExplodeOverlay, #techExplodeOverlay {
             transform: scale(0.65) translateY(10%) !important;
             transform-origin: center center !important;
             background: transparent !important;
          }
        `;
        doc.head.appendChild(style);
      } catch(e) {
        console.log("CORS", e);
      }
    }
  </script>
</body>
</html>
