<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 2 - Corte Axonométrico</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      overflow: hidden; background: #050308; 
      font-family: 'Geist', sans-serif; color: #f4f2ff;
    }
    iframe { width: 100%; height: 100%; border: none; display: block; background: transparent; }

    /* Top Right Controls */
    .top-right-controls {
      position: absolute; top: 24px; right: 24px; z-index: 9999;
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
      pointer-events: none; /* Let clicks pass through except on buttons */
    }
    .top-right-controls > * { pointer-events: auto; }

    /* Badge "Humedal del Burro" */
    .badge-top {
      background: rgba(12, 10, 20, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 184, 41, 0.5);
      color: #ffb829; padding: 10px 18px; border-radius: 8px;
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: slideInRight 0.5s ease forwards;
    }

    /* Botón Volver */
    .back-btn {
      background: rgba(12, 10, 20, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 184, 41, 0.5);
      color: #ffb829; padding: 12px 24px; border-radius: 999px;
      font-size: 13px; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 10px; cursor: pointer; overflow: hidden;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 20px rgba(255, 184, 41, 0.2);
      position: relative;
    }
    .back-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,184,41,0.3), transparent); transition: all 0.5s ease; }
    .back-btn:hover { background: rgba(255, 184, 41, 0.2); border-color: rgba(255, 184, 41, 0.8); transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 184, 41, 0.4); color: #fff; }
    .back-btn:hover::before { left: 100%; }
    
    .back-btn span { display: inline-block; animation: floatText 3s ease-in-out infinite; }
    .back-btn span:nth-child(1) { animation-delay: 0.0s; } .back-btn span:nth-child(2) { animation-delay: 0.1s; }
    .back-btn span:nth-child(3) { animation-delay: 0.2s; } .back-btn span:nth-child(4) { animation-delay: 0.3s; }
    .back-btn span:nth-child(5) { animation-delay: 0.4s; } .back-btn span:nth-child(6) { animation-delay: 0.5s; }
    @keyframes floatText { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); color: #fff; } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  </style>
</head>
<body>
  
  <div class="top-right-controls">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
      <div><span>V</span><span>o</span><span>l</span><span>v</span><span>e</span><span>r</span></div>
    </a>
    <div class="badge-top">Humedal del Burro</div>
  </div>

  <iframe src="corte.html?embed=1" onload="injectHacks(this)"></iframe>

  <script>
    function injectHacks(iframe) {
      try {
        const doc = iframe.contentWindow.document;
        if (!doc) return;
        
        const style = doc.createElement('style');
        style.textContent = `
          /* Ocultar solo el panel izquierdo de iconos generales y la cabecera */
          aside.sidebar-icons-only, .site-nav, .navigation-unified, header.nav, .nav { display: none !important; }
          
          /* Ocultar la barra inferior derecha de Mapbox que el usuario no quiere */
          .mapboxgl-control-container, .mapbox-logo, .mapboxgl-ctrl-bottom-right, .mapboxgl-ctrl { display: none !important; opacity: 0 !important; pointer-events: none !important; }
          
          /* Ajustar pantalla completa */
          .app, .main, body, .viewport, .map-container, #map { padding-left: 0 !important; margin-left: 0 !important; left: 0 !important; width: 100% !important; max-width: 100% !important; }
          
          /* Asegurar que las barras de controles de las escalas SI se vean */
          .controls-bar { z-index: 1000 !important; }
        `;
        doc.head.appendChild(style);
        
      } catch(e) {
        console.log("CORS restriction preventing iframe DOM access", e);
      }
    }
  </script>
</body>
</html>
